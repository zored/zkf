[package]
name = "zkf-host"
version = "0.1.0"
edition = "2021"
description = "Tells ZKF keyboards the host input source and volume over Raw HID"

[dependencies]
hidapi = "2.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
