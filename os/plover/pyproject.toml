[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plover-zkf"
version = "0.1.0"
description = "ZKF helpers for Plover: macOS output that ignores Cmd/Ctrl layers of the active input source"
keywords = ["plover", "plover_plugin"]
requires-python = ">=3.9"

[project.entry-points."plover.extension"]
zkf_layout_fix = "plover_zkf:LayoutFix"

[tool.setuptools]
packages = ["plover_zkf"]
