keyboards:
  ergodox_ez:
    layers:
      default:
        enableCombos: true
        lights: []
        keys:
          left:
            - [esc, 1, 2, 3, 4, 5, ~]
            - [esc, q, w, e, r, t, ~]
            - [capsDance, aDance, s, d, f, g]
            - ['shift(', zDance, xDance, cDance, v, b, doFutureApp]
            - [leader, toggleNavigation, ~, doCopy, doPaste]
          left-thumb:
            - [esc, doOneShotTurbo]
            - [home]
            - [space, backspace, end]
          right:
            - [~, 6, 7, 8, 9, 0, ~]
            - [~, y, u, i, o, p, \]
            - [   h, j, k, l, semicolonDance, quoteDance]
            - [doPastApp, n, m, commaDance, dotDance, slashDance, 'shift)']
            - ['[', ']', doPastWindow, doFutureWindow, toggleGame]
          right-thumb:
            - [esc, ~]
            - [pageUp]
            - [pageDown, tabDance, enter]
      game:
        lights: [3]
        keys:
          left:
            - [esc, 1, 2, 3, 4, 5, ~]
            - [tab, ~, ~, ~, ~, ~, ~]
            - [capslock, a, ~, ~, ~, ~]
            - [lShift, z, x, c, ~, ~, ~]
            - [lCtrl, lAlt, lGui, holdGameMirror, holdGameNumbers]
          left-thumb:
            - [~, ~]
            - [~]
            - [~, ~, ~]
          right:
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, ~, ~, ~, ~, ~, ~]
            - [   ~, ~, ~, ~, ';', "'"]
            - [~, ~, ~, ',', '.', '/', rShift]
            - [toggleGameMouse, ~, ~, ~, ~]
          right-thumb:
            - [~, ~]
            - [~]
            - [~, tab, ~]
      gameNumbers:
        lights: [2,3]
        keys:
          left:
            - [~, f1,f2,f3,f4, f5, ~]
            - [~, 1, 2, 3, f6, f7, ~]
            - [~, 4, 5, 6, f8, f9]
            - [~, 7, 8, 9, f10,f11, ~]
            - [~, ~, 0, ~, ~]
          left-thumb:
            - [~, ~]
            - [~]
            - [~, ~, ~]
          right:
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, ~, ~, ~, ~, ~, ~]
            - [   ~, ~, ~, ~, ~, ~]
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, ~, ~, ~, ~]
          right-thumb:
            - [~, ~]
            - [~]
            - [~, ~, ~]
      gameMouse:
        lights: [1,3]
        keys:
          left:
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, ~, ~, ~, ~, ~]
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, ~, 0, ~, ~]
          left-thumb:
            - [~, ~]
            - [~]
            - [~, ~, ~]
          right:
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, ~, mouseLeftButton, mouseUp, mouseRightButton, ~, ~]
            - [   ~, mouseLeft,mouseDown,mouseRight, ~, ~]
            - [~, ~, wheelDown, wheelClick, wheelUp, ~, ~]
            - [toggleGameMouse, ~, ~, ~, ~]
          right-thumb:
            - [~, ~]
            - [~]
            - [~, ~, ~]
      gameMirror:
        lights: [2,3]
        keys:
          left:
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, y, u, i, o, p, ~]
            - [~, h, j, k, l, ';']
            - [~, n, m, ',', '.', '/', ~]
            - [~, ~, 0, ~, ~]
          left-thumb:
            - [~, ~]
            - [~]
            - [enter, delete, ~]
          right:
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, ~, ~, ~, ~, ~, ~]
            - [   ~, ~, ~, ~, ~, ~]
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, ~, ~, ~, ~]
          right-thumb:
            - [~, ~]
            - [~]
            - [~, ~, ~]
      symbol:
        lights: [2]
        keys:
          left:
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, '!', '#', '{', '}', '/', ~]
            - [~, '@', '$', '(', ')', '`']
            - [~, percentDance, circumflexDance, leftSquareBracketDance, ']', '~', ~]
            - [~, ~, ~, doPast, doFuture]
          left-thumb:
            - [~, ~]
            - [~]
            - [~, delete, ~]
          right:
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, '=', 7, 8, 9, '&', '|']
            - [   '+', 4, 5, 6, '*', ~]
            - [~, '-', 1, 2, 3, '/', ~]
            - [~, '0', '.', ~, ~]
          right-thumb:
            - [~, ~]
            - [~]
            - [~, ~, ~]
      navigation:
        lights: [1]
        keys:
          left:
            - [~, ~, ~, ~, ~, ~, toggleSteno]
            - [~, ~, mouseRightButton, mouseUp, mouseLeftButton, ~, ~]
            - [~, ~, mouseLeft, mouseDown, mouseRight, ~]
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, ~, ~, doFutureApp, doPastApp]
          left-thumb:
            - [~, ~]
            - [~]
            - [~, ~, ~]
          right:
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, ~, brightnessDown, brightnessUp, ~, ~, ~]
            - [   left, down, up, right, ~, ~]
            - [~, wheelLeft, wheelDown, wheelUp, wheelRight, ~, ~]
            - [      volumeDown, volumeUp, volumeToggle, ~, ~]
          right-thumb:
            - [~, ~]
            - [~]
            - [~, ~, ~]
      emoji:
        lights: [1,3]
        keys:
          left:
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, happyDance, sadDance, strangeDance, ~, ~, ~]
            - [~, coolDance, okDance, loveDance, ~, ~]
            - [~, ~, ~, doFutureWindow, doPastWindow, ~, ~]
            - [doBootloader, ~, ~, doFutureApp, doPastApp]
          left-thumb:
            - [~, ~]
            - [~]
            - [~, ~, ~]
          right:
            - [~, recordMacro1, recordMacro2, stopRecordMacro, playMacro1, playMacro2, ~]
            - [~, ~, F7Dance, F8Dance, F9Dance, ~, ~]
            - [   ~, F4Dance, F5Dance, F6Dance, ~, ~]
            - [~, ~, F1Dance, F2Dance, F3Dance, ~, ~]
            - [~, ~, F10Dance, ~, ~]
          right-thumb:
            - [~, ~]
            - [~]
            - [~, ~, ~]
      navigation2:
        lights: [3]
        keys:
          left:
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, ~, ~, ~, ~, ~]
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, ~, ~, ~, ~]
          left-thumb:
            - [~, ~]
            - [~]
            - [~, ~, ~]
          right:
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, shutdown, sleep, windowsMode, macosMode, ~, ~]
            - [   home, pageDown, pageUp, end, ~, ~]
            - [~, mediaPrev, ~, mediaToggle, mediaNext, ~, ~]
            - [~, ~, ~, ~, ~]
          right-thumb:
            - [~, ~]
            - [~]
            - [~, ~, ~]
      history:
        lights: [3]
        keys:
          left:
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, ~, home, pageDown, pageUp, end]
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, ~, ~, ~, ~]
          left-thumb:
            - [~, ~]
            - [~]
            - [~, ~, ~]
          right:
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, ~, ~, ~, ~, ~, ~]
            - [    doFutureTab, doFutureApp, doPastApp, doPastTab, ~, ~]
            - [~, doFutureWindow, doFuture, doPast, doPastWindow, ~, ~]
            - [~, ~, ~, ~, ~]
          right-thumb:
            - [~, ~]
            - [~]
            - [~, ~, ~]
      # template:
      #   lights: [1,2,3]
      #   keys:
      #     left:
      #       - [~, ~, ~, ~, ~, ~, ~]
      #       - [~, ~, ~, ~, ~, ~, ~]
      #       - [~, ~, ~, ~, ~, ~]
      #       - [~, ~, ~, ~, ~, ~, ~]
      #       - [~, ~, ~, ~, ~]
      #     left-thumb:
      #       - [~, ~]
      #       - [~]
      #       - [~, ~, ~]
      #     right:
      #       - [~, ~, ~, ~, ~, ~, ~]
      #       - [~, ~, ~, ~, ~, ~, ~]
      #       - [   ~, ~, ~, ~, ~, ~]
      #       - [~, ~, ~, ~, ~, ~, ~]
      #       - [~, ~, ~, ~, ~]
      #     right-thumb:
      #       - [~, ~]
      #       - [~]
      #       - [~, ~, ~]
      steno:
        lights: [1, 2, 3]
        keys:
          left:
            - [~, ~, ~, ~, ~, ~, toggleSteno]
            - [~, sN1, sN2, sN3, sN4, sN5, ~]
            - [~, sS1, sTL, sPL, sHL, sST1]
            - [~, sS2, sKL, sWL, sRL, sST2, ~]
            - [~, ~, ~, sA, sO]
          left-thumb:
            - [~, ~]
            - [~]
            - [sA, sO, ~]
          right:
            - [~, ~, ~, ~, ~, ~, ~]
            - [~, sN6, sN7, sN8, sN9, sNA, sNB]
            - [   sST3, sFR, sPR, sLR, sTR, sDR]
            - [~, sST4, sRR, sBR, sGR, sSR, sZR]
            - [sE, sU, ~, ~, ~]
          right-thumb:
            - [~, ~]
            - [~]
            - [~, sE, sU]
    settings:
      # https://docs.qmk.fm/#/config_options?id=the-configh-file
      config: &config
        COMBO_TERM: 80
        ENCODER_RESOLUTION: 4
        NKRO_DEFAULT_ON: 'true'
        LEADER_TIMEOUT: 300

        # MK_3_SPEED: ''
        # # Cursor:
        # MK_C_OFFSET_0: 8
        # MK_C_OFFSET_1: 16
        # MK_C_OFFSET_2: 32
        # MK_C_INTERVAL_0: 16
        # MK_C_INTERVAL_1: 16
        # MK_C_INTERVAL_2: 16
        # # Wheel:
        # MK_W_OFFSET_0: 1
        # MK_W_OFFSET_1: 2
        # MK_W_OFFSET_2: 4
        # MK_W_INTERVAL_0: 20
        # MK_W_INTERVAL_1: 20
        # MK_W_INTERVAL_2: 20

        MOUSEKEY_DELAY: 0
        MOUSEKEY_INTERVAL: 16
        MOUSEKEY_MOVE_DELTA: 5
        MOUSEKEY_MAX_SPEED: 16
        MOUSEKEY_SLOW_SPEED: 1
        MOUSEKEY_FAST_SPEED: 7
        MOUSEKEY_TIME_TO_MAX: 80
        MOUSEKEY_WHEEL_DELAY: 0
        MOUSEKEY_WHEEL_INTERVAL: 16
        MOUSEKEY_WHEEL_MAX_SPEED: 4
        MOUSEKEY_WHEEL_TIME_TO_MAX: 180

        NO_DEBUG: ''
        NO_PRINT: ''
        ONESHOT_TAP_TOGGLE: 5
        ONESHOT_TIMEOUT: 4000
        TAPPING_TERM: 110
        TAPPING_TERM_TAP_DANCE: 270
        TAPPING_TERM_PER_KEY: ''
        UNICODE_SELECTED_MODES: 'UNICODE_MODE_MACOS, UNICODE_MODE_WINCOMPOSE'
        
        # My custom settings:
        TURBO_SIGNAL_TIMEOUT: 100
        TURBO_NO_SIGNAL_TIMEOUT: 200
        APP_SWITCH_TIMEOUT: 250


      # https://docs.qmk.fm/#/config_options?id=the-rulesmk-file
      rules: &rules
        AUDIO_ENABLE: 'no'
        AUTO_SHIFT_ENABLE: 'no'
        BACKLIGHT_ENABLE: 'no'
        BOOTMAGIC_ENABLE: 'no'
        COMBO_ENABLE: 'yes'
        COMMAND_ENABLE: 'no'
        CONSOLE_ENABLE: 'no'
        DYNAMIC_MACRO_ENABLE: 'no'
        EXTRAKEY_ENABLE: 'yes'
        KEY_LOCK_ENABLE: 'no'
        LEADER_ENABLE: 'yes'
        LTO_ENABLE: 'yes'
        NKRO_ENABLE: 'yes'
        PLOVER_HID_ENABLE: 'yes'
        RGBLIGHT_ENABLE: 'no'
        SLEEP_LED_ENABLE: 'no'
        STENO_ENABLE: 'no'
        TAP_DANCE_ENABLE: 'yes'
        UNICODE_ENABLE: 'no'
        UNICODEMAP_ENABLE: 'yes'
    combos: &combos # Pairs of letters: [w+e, r+t, ...]
      - [doTerminal, doNotEquals, doScreenshot, doClose]
      - [doEmojiPanel, '*', doUnderscore, doAmpersand]
      - [~, doArrow]
  planck:
    settings:
      rules:
        <<: *rules
        AUDIO_ENABLE: 'yes'
        PLOVER_HID_ENABLE: 'no'
      config:
        <<: *config
        AUDIO_CLICKY: ''
        AUDIO_DEFAULT_CLICKY_ON: 'false'
        MOUSEKEY_INTERVAL: 4
        MOUSEKEY_MOVE_DELTA: 1
        MOUSEKEY_MAX_SPEED: 26
        MOUSEKEY_TIME_TO_MAX: 200
        MOUSEKEY_SLOW_SPEED: 2
        MOUSEKEY_FAST_SPEED: 9
        STARTUP_SONG: SONG(NO_SOUND)
    combos: *combos
    layers:
      default:
        enableCombos: true
        lights: []
        keys:
            - [esc, q, w, e, r, t, y, u, i, o, p, \]
            - [capsDance, aDance, s, d, f, g, h, j, k, l, semicolonDance, quoteDance]
            - ['shift(', zDance, xDance, cDance, v, b, n, m, commaDance, dotDance, slashDance, 'shift)']
            - [leader, toggleNavigation, ~, delete, backspace, space, ~, tabDance, enter, '[', ']', toggleGame]
      symbol:
        lights: [1]
        keys:
            - [~, '!', '#', '{', '}','/', '=', 7, 8, 9, '&', '|']
            - [~, '@', '$', '(', ')', '`', '+', 4, 5, 6, '*', ~]
            - [~, percentDance, circumflexDance, leftSquareBracketDance, ']', '~', '-', 1, 2, 3, '/', ~]
            - [~, ~, ~, ~, delete, ~, ~, ~, 0, '.', ~, ~]
      navigation:
        lights: [2]
        keys:
            - [~, ~, mouseRightButton, mouseUp, mouseLeftButton, ~, ~, brightnessDown, brightnessUp, ~, ~, ~]
            - [~, ~, mouseLeft, mouseDown, mouseRight, ~, left, down, up, right, ~, ~]
            - [~, ~, ~, ~, ~, ~, wheelLeft, wheelDown, wheelUp, wheelRight, ~, ~]
            - [~, ~, ~, ~, ~, ~, ~, volumeDown, volumeUp, volumeToggle, ~, ~]
      navigation2:
        lights: [1]
        keys:
            - [~, rgbBriDown, rgbBriUp, rgbSatDown, rgbSatUp, ~, shutdown, sleep, windowsMode, macosMode, ~, ~]
            - [~, audioClickToggle, audioClickUp, audioClickDown, ~, ~, home, pageDown, pageUp, end, ~, ~]
            - [~, musicToggle, musicMode, ~, ~, ~, mediaPrev, ~, mediaToggle, mediaNext, ~, ~]
            - [~, ~, ~, ~, ~, ~, ~, rgbPrev, rgbNext, rgbToggle, rgbHueDown, rgbHueUp]
      emoji:
        lights: [1,2]
        keys:
            - [~, happyDance, sadDance, strangeDance, ~, ~, ~, F7Dance, F8Dance, F9Dance, ~, ~]
            - [~, coolDance, okDance, loveDance, ~, ~, ~, F4Dance, F5Dance, F6Dance, ~, ~]
            - [~, ~, ~, ~, ~, ~, ~, F1Dance, F2Dance, F3Dance, ~, ~]
            - [doBootloader, ~, ~, ~, ~, ~, ~, ~, F10Dance, ~, ~, ~] 
      history:
        lights: [1,2]
        keys:
            - [~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~]
            - [~, ~, home, pageDown, pageUp, end, doFutureTab, doFutureApp, doPastApp, doPastTab, ~, ~]
            - [~, ~, ~, ~, ~, ~, doFutureWindow, doFuture, doPast, doPastWindow, ~, ~]
            - [~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~]
      game:
        lights: [2]
        keys:
            - [~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~]
            - [tab, a, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~]
            - [lShift, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~]
            - [lCtrl, lAlt, lGui, holdGameMirror, planckGameBackspaceDance, ~, ~, ~, rgui, rAlt, rCtrl, ~]
      gameMirror:
        lights: [1]
        keys:
            - [~, y, u, i, o, p, ~, ~, ~, ~, ~, ~]
            - [capsLock, h, j, k, l, ";", "'", ~, ~, ~, ~, ~]
            - [rShift, n, m, ",", ".", "/", ~, ~, ~, ~, ~, ~]
            - [rCtrl, rAlt, rGui, ~, tab, enter, ~, ~, ~, ~, ~, ~]
      gameNumbers:
        lights: [1,2]
        keys:
            - [~, 1, 2, 3, f1, f2, ~, ~, ~, ~, ~, ~]
            - [~, 4, 5, 6, f3, f4, ~, ~, ~, ~, ~, ~]
            - [~, 7, 8, 9, f5, f6, ~, ~, ~, ~, ~, ~]
            - [~, ~, 0, ~, ~, ~, ~, ~, ~, ~, ~, ~]
  ymd09:
    settings:
      rules:
        <<: *rules
        COMBO_ENABLE: 'no'
        DYNAMIC_MACRO_ENABLE: 'no'
        PLOVER_HID_ENABLE: 'no'
        EXTRAKEY_ENABLE: 'no'
        KEY_LOCK_ENABLE: 'no'
        LEADER_ENABLE: 'no'
        NKRO_ENABLE: 'no'
        UNICODEMAP_ENABLE: 'no'
      config:
        <<: *config
    combos: []
    mappings:
      ru:
      - "abcdefghijklmnopqrstuvwxyz,;[]'.`"
      - "абвгдеёжзийклмнопрстуфхцчшщъыьэюя"
      en_fast:
      - "abcdefghijklmnopqrstuvwxyz,;[]'.`"
      - "nshetaoriqmwdlcfuvxkgypjbz[`.,;]'"
      ru_fast:
      - "abcdefghijklmnopqrstuvwxyz,;[]'.`"
      - "тсроеаивнжпулкмядбхчыьгйзшюъщэфцё"
    layers:
      default:
        keys: 
        - [y1Dance,y2Dance,y3Dance]
        - [y4Dance,y5Dance,y6Dance]
        - [y7Dance,y8Dance,y9Dance]
      layer1A:
        keys:
        - [~,1,2]
        - [3,4,5]
        - [6,7,8]
      layer1B:
        keys:
        - [toggleLayer1B, pageDown, pageUp]
        - [mouseLeftButton, mouseUp, mouseRightButton]
        - [mouseLeft, mouseDown, mouseRight]
      layer2A:
        keys:
        - ['-',~,'+']
        - [9,enter,0]
        - ['/','=','*']
      layer2B:
        keys:
        - [F1Dance,~,F2Dance]
        - [F3Dance,F4Dance,F5Dance]
        - [F6Dance,F7Dance,F8Dance]
      layer2C:
        keys:
        - [esc,~,~]
        - [F9Dance,~,F10Dance]
        - [home,insert,end]
      layer3A:
        keys:
        - [windowsMode,macosMode,~]
        - [doNextMapping,doNextLanguage,~]
        - [doBootloader,~,~]
      layer3B:
        keys:
        - [esc,enter,toggleLayer3B]
        - [pageDown, up, pageUp]
        - [left, down, right]
      layer4:
        keys:
        - [j,k,l]
        - [~,m,n]
        - [o,p,q]
      layer5:
        keys:
        - [r,s,t]
        - [u,~,v]
        - [w,x,y]
      layer6:
        keys:
        - [z,',',';']
        - ['[',']',~]
        - ["'",'.','`']
      layer7:
        keys:
        - [backspace, space, enter]
        - [doOneShotCtrl,doOneShotAlt,doOneShotGui]
        - [~,pageDown,doOneShotShift]
      layer8A:
        keys:
        - [rgbBriDown,rgbToggle,rgbBriUp]
        - [rgbHueDown,rgbNext,rgbHueUp]
        - [rgbSatDown,~,rgbSatUp]
      layer8B:
        keys:
        - [toggleLayer1B,~,toggleLayer3B]
        - [~,~,~]
        - [~,~,~]
      layer9:
        keys:
        - ["'",'.','`']  
        - ['/','\',delete]
        - [esc,tab,~]
keys:
  y1Dance: {tap: [[a]], hold: [[holdLayer1A],[holdLayer1B]]}
  y2Dance: {tap: [[b]], hold: [[holdLayer2A]]}
  y3Dance: {tap: [[c]], hold: [[holdLayer3A],[holdLayer3B]]}
  y4Dance: {tap: [[d]], hold: [[holdLayer4], [lCtrl]]}
  y5Dance: {tap: [[e]], hold: [[holdLayer5], [lAlt]]}
  y6Dance: {tap: [[f]], hold: [[holdLayer6], [lGui]]}
  y7Dance: {tap: [[g]], hold: [[holdLayer7], [lShift]]}
  y8Dance: {tap: [[h]], hold: [[holdLayer8A],[holdLayer8B]]}
  y9Dance: {tap: [[i]], hold: [[holdLayer9], [rShift]]}
  tabDance:
    tap:
    - [tab]
    hold:
    - [holdSymbol]
  capsDance:
    tap:
    - [doNextLanguage]
    hold:
    - [holdSymbol]
    - [holdSymbol, lCtrl]
  aDance:
    tap: [[a]]
    hold: &aDance
    - [holdHistory]
  zDance:
    tap: [[z]]
    hold: &lCtrlDance
    - [lCtrl]
    - [lCtrl, lShift]
    - [lCtrl, lAlt, lGui]
  xDance:
    tap: [[x]]
    hold: &lAltDance
    - [lAlt]
    - [lAlt, lShift]
  slashDance:
    tap: [['/']]
    hold:
    - [rCtrl]
    - [rCtrl, rShift]
  dotDance:
    tap: [['.']]
    hold:
    - [rAlt]
    - [rAlt, rShift]
  commaDance:
    tap: [[',']]
    hold:
    - [rgui]
    - [rgui, rShift]
  cDance:
    tap: [[c]]
    hold: &lGuiDance
    - [lGui]
    - [lGui, lShift]
  percentDance:
    tap: [['lShift', 5]] # %
    hold: *lCtrlDance
  circumflexDance:
    tap: [['lShift', 6]] # ^
    hold: *lAltDance
  leftSquareBracketDance:
    tap: [['[']]
    hold: *lGuiDance
  happyDance: {tap: [[😊], [😁], [😄], [😂]]}
  sadDance: {tap: [[😞], [😢], [😭]]}
  coolDance: {tap: [[😏], [😎], [💪], [🔥]]}
  loveDance: {tap: [[😚], [😍], [😘], [💖]]}
  strangeDance: {tap: [[🤔], [🤨], [😱]]}
  okDance: {tap: [[👍], [👌], [🆗]]}
  F1Dance: {tap: [['f1'], ['f11']]}
  F2Dance: {tap: [['f2'], ['f12']]}
  F3Dance: {tap: [['f3'], ['f13']]}
  F4Dance: {tap: [['f4'], ['f14']]}
