name: release
on: push
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - run: ./project.sh ci
    - uses: softprops/action-gh-release@v3
      if: "startsWith(github.ref, 'refs/tags/v')"
      with:
        files: |
          firmwares/ergodox_ez.hex
          firmwares/planck.bin
          firmwares/ymd09.hex
